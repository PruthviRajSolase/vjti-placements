<!DOCTYPE html>
<!--
  VJTI PLACEMENTS — STEP 7 (React + Vite)

  Compare this with vanilla-version/index.html! Differences:
  - NO <link> to CSS, NO <script> for data/script files.
    Instead: ONE module script that boots React.
  - <div id="root"></div> — an EMPTY page. React builds
    EVERYTHING inside this one div. The DOM you wrote by hand
    is now generated by components (src/App.jsx).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VJTI placement statistics, company-wise packages, branch data and reviewed interview experiences."
    />
    <title>VJTI Placements — Stats, Companies &amp; Experiences</title>

    <!-- STEP 10: choose the theme BEFORE the page paints, so there is no
         white flash on reload. First visit follows the OS preference;
         after that, the user's saved choice wins. React reads this
         attribute when it mounts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("vjti-placements-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "dark" || saved === "light"
            ? saved
            : (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body id="top">
    <!-- React's mount point: everything renders inside here -->
    <div id="root"></div>

    <noscript>
      <p class="noscript-warning">
        This site needs JavaScript to load placement data. Please enable it.
      </p>
    </noscript>

    <!-- type="module" = modern JS. Vite rewrites this path during build. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
